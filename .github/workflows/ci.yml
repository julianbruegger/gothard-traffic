name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  php:
    name: PHP lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # 2.35.2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, pdo_mysql

      - name: Lint PHP
        run: |
          set -euo pipefail
          find server -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Run PHP tests
        run: |
          set -euo pipefail
          for t in server/cron/tests/test-*.php; do
            echo "== $t"
            php "$t"
          done

  site:
    name: Astro check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Check & build
        working-directory: site
        run: npm run build

      - name: Tests (Swiss time, TS/PHP summary parity)
        working-directory: site
        run: npm test
