name: Build & deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build static site
        working-directory: site
        run: npm run build

      - name: Assemble deploy bundle
        run: |
          set -euo pipefail
          rm -rf deploy-staging
          mkdir -p deploy-staging

          # Astro's static output - the public HTML/CSS/JS. The sample
          # data/*.json shipped for local dev must never overwrite the
          # live, cron-maintained JSON files on the host, so it's dropped here.
          cp -r site/dist/. deploy-staging/
          rm -rf deploy-staging/data

          # PHP SSR wrapper + shared libs, served from the same web root as
          # the static output (index.php takes precedence over index.html
          # on hosts with the usual DirectoryIndex order).
          cp server/index.php deploy-staging/index.php
          cp -r server/lib deploy-staging/lib

          # translations.json is authored once in the Astro project and
          # copied here so the PHP layer always matches the latest strings.
          cp site/src/data/translations.json deploy-staging/translations.json

          # Cron scraper, minus local test fixtures.
          mkdir -p deploy-staging/cron
          cp -r server/cron/. deploy-staging/cron/
          rm -rf deploy-staging/cron/tests

          find deploy-staging -maxdepth 2

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-staging
          retention-days: 14

  deploy:
    name: Deploy over FTP
    needs: build
    runs-on: ubuntu-latest
    # Deploying requires FTP_SERVER / FTP_USERNAME / FTP_PASSWORD repo secrets.
    # Gated behind a repo variable so pushes don't fail loudly before you've
    # set those up: Settings -> Secrets and variables -> Actions -> Variables
    # -> new variable DEPLOY_ENABLED = true.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-staging

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          local-dir: deploy-staging/
          exclude: |
            **/data/**
            **/cron/config.php
