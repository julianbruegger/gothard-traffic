name: Build & deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'server/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-hostpoint
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: Hostpoint

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build static site
        working-directory: site
        run: npm run build

      - name: Assemble deploy bundle
        run: |
          set -euo pipefail
          rm -rf deploy-staging
          mkdir -p deploy-staging

          # Static Astro output. Sample data/*.json is for local dev only;
          # live data is served from the database via api/*.php.
          cp -r site/dist/. deploy-staging/
          rm -rf deploy-staging/data

          # PHP SSR wrapper + shared libs + DB-backed API endpoints
          cp  server/index.php  deploy-staging/index.php
          cp -r server/lib      deploy-staging/lib
          cp -r server/api      deploy-staging/api

          # translations.json kept in sync with the Astro project
          cp site/src/data/translations.json deploy-staging/translations.json

          # Cron scraper (minus local test fixtures and any stale config)
          mkdir -p deploy-staging/cron
          cp -r server/cron/. deploy-staging/cron/
          rm -rf deploy-staging/cron/tests
          rm -f  deploy-staging/cron/config.php

          # Schema reference lives next to the cron scripts (cron/ is denied over HTTP)
          cp server/schema.sql deploy-staging/cron/schema.sql

          # data/ is written by cron at runtime; only its .htaccess is synced
          # (see the rsync filters below), so it is never publicly readable.
          mkdir -p deploy-staging/data
          cp server/data/.htaccess deploy-staging/data/.htaccess

          echo "Deploy tree:" && find deploy-staging -maxdepth 2 -type d

      - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # 2.35.2
        with:
          php-version: '8.3'

      - name: Generate cron/config.php from secrets
        env:
          API_TOKEN: ${{ secrets.DATEX_API_TOKEN }}
          DB_HOST:   ${{ secrets.DB_HOST }}
          DB_NAME:   ${{ secrets.DB_NAME }}
          DB_USER:   ${{ secrets.DB_USER }}
          DB_PASS:   ${{ secrets.DB_PASS }}
          # Optional: enables IndexNow pings from the collector (empty = off).
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          # Use PHP itself to write the config so all values are properly escaped.
          php -r "
            \$config = [
                'api_url'       => 'https://api.opentransportdata.swiss/TDP/Soap_Datex2/TrafficSituations/Pull',
                'api_token'     => getenv('API_TOKEN'),
                'auth_header'   => 'Authorization',
                'auth_prefix'   => 'Bearer ',
                'keywords'      => ['gotthard', 'göschenen', 'goeschenen', 'airolo'],
                'pass_keywords' => ['gotthardpass', 'passstrasse', 'pass strasse', 'passo del gottardo'],
                'db_host'       => getenv('DB_HOST'),
                'db_name'       => getenv('DB_NAME'),
                'db_user'       => getenv('DB_USER'),
                'db_pass'       => getenv('DB_PASS'),
                'error_log'     => __DIR__ . '/../data/fetch-error.log',
                'indexnow_key'  => getenv('INDEXNOW_KEY') ?: null,
            ];
            \$php = '<?php' . PHP_EOL . 'return ' . var_export(\$config, true) . ';' . PHP_EOL;
            file_put_contents('deploy-staging/cron/config.php', \$php);
            echo 'config.php generated (' . filesize('deploy-staging/cron/config.php') . ' bytes)' . PHP_EOL;
            // IndexNow key file in the web root, so rsync --delete never removes it.
            \$key = (string) getenv('INDEXNOW_KEY');
            if (preg_match('/^[a-zA-Z0-9-]{8,128}\$/', \$key)) {
                file_put_contents('deploy-staging/' . \$key . '.txt', \$key);
                echo 'IndexNow key file written' . PHP_EOL;
            }
          "

      - name: Deploy via rsync over SSH
        env:
          SSH_KEY:     ${{ secrets.HOSTPOINT_SSH_KEY }}
          SSH_HOST:    ${{ secrets.HOSTPOINT_HOST }}
          SSH_USER:    ${{ secrets.HOSTPOINT_USER }}
          REMOTE_PATH: ${{ secrets.HOSTPOINT_PATH }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?HOSTPOINT_HOST secret is not set (WebHosting environment)}"
          : "${SSH_USER:?HOSTPOINT_USER secret is not set (WebHosting environment)}"
          : "${SSH_KEY:?HOSTPOINT_SSH_KEY secret is not set (WebHosting environment)}"
          : "${REMOTE_PATH:?HOSTPOINT_PATH secret is not set (WebHosting environment)}"

          # Strip any stray whitespace/newlines that may have been copied into secrets
          SSH_HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          SSH_USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          REMOTE_PATH=$(echo "$REMOTE_PATH" | tr -d '[:space:]')

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # --delete keeps the remote clean. data/ is cron-written: only
          # data/.htaccess is synced; everything else there is excluded, so
          # it is neither overwritten nor deleted.
          rsync -az --delete \
            --include 'data/' \
            --include 'data/.htaccess' \
            --exclude 'data/*' \
            --exclude '.well-known/' \
            -e "ssh $SSH_OPTS" \
            deploy-staging/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

          # Create tables / apply additive column migrations (idempotent).
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "cd $(printf '%q' "$REMOTE_PATH") && php cron/migrate.php"

          rm -f ~/.ssh/deploy_key

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gotthard.jubr.app' }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"

          fetch() { # url -> stdout; retries for a short while after the deploy
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
              --retry-all-errors --max-time 30 "$1"
          }
          status() { curl --silent --output /dev/null --max-time 30 --write-out '%{http_code}' "$1"; }

          for path in / /en /forecasts; do
            echo "GET $path"
            fetch "$base$path" >/dev/null
          done

          fetch "$base/" | grep -q 'id="status-badge"' \
            || { echo "::error::home page lacks id=\"status-badge\""; exit 1; }

          fetch "$base/api/gotthard.php" > api.json
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          d = json.load(open('api.json'))
          updated = datetime.fromisoformat(d['updated'])
          age = (datetime.now(timezone.utc) - updated).total_seconds() / 60
          print(f"API updated {age:.1f} min ago")
          if age > 30:
              sys.exit(f"API data is stale ({age:.0f} min > 30 min)")
          PY

          # Internal files must not be public (#53)
          [ "$(status "$base/data/stats-cache.json")" != 200 ] || { echo "::error::data/ is public"; exit 1; }
          [ "$(status "$base/schema.sql")" != 200 ] || { echo "::error::schema.sql is public"; exit 1; }

